<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Desenho - TV</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { font-size: 2.3rem; margin-bottom: 5px; color: #38bdf8; text-align: center; }
        .lobby-container {
            display: flex;
            width: 90%;
            max-width: 1100px;
            gap: 30px;
            align-items: stretch;
            justify-content: center;
            margin-top: 20px;
        }
        .qr-section {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        #qrcode {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .seats-section {
            flex-grow: 1;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .seat {
            background: #334155;
            border: 2px dashed #64748b;
            border-radius: 12px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .seat.occupied {
            background: #0284c7;
            border: 2px solid #38bdf8;
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        .seat .avatar { font-size: 2rem; margin-bottom: 3px; }
        .seat .name { font-weight: bold; font-size: 1rem; }
        
        #game-screen {
            display: none;
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>

    <div id="lobby-screen" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <h1>Sala de Espera - Cinema do Desenho</h1>
        <p id="tv-status" style="color: #facc15; margin-top: 0; font-size: 1.1rem; font-weight: bold;">Aguardando o Anfitrião iniciar a partida no telemóvel...</p>

        <div class="lobby-container">
            <div class="qr-section">
                <h3 style="margin-top:0;">Entrar pelo Telemóvel</h3>
                <div id="qrcode"></div>
                <p id="room-url" style="margin-top: 12px; font-size: 0.8rem; color: #38bdf8; word-break: break-all; max-width: 200px; text-align: center;"></p>
            </div>

            <div class="seats-section">
                <h3 style="margin-top:0;">Lugares na Sala (<span id="player-count">0</span>/8)</h3>
                <div class="seats-grid" id="seats-grid"></div>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <h2 style="color: #38bdf8; font-size: 2rem;">Rodada <span id="round-number">1</span> de 6</h2>
        <p style="font-size: 1.4rem; color: #94a3b8;">Desenhe no telemóvel o tema:</p>
        <h1 id="theme-display" style="font-size: 2.8rem; color: #facc15; margin-top: 20px;">Carregando...</h1>
    </div>

    <script>
        const socket = io();
        const controlUrl = window.location.origin + '/controle.html';
        document.getElementById('room-url').innerText = controlUrl;
        new QRCode(document.getElementById("qrcode"), {
            text: controlUrl,
            width: 150,
            height: 150
        });

        const seatsGrid = document.getElementById('seats-grid');
        function renderSeats(players) {
            seatsGrid.innerHTML = '';
            document.getElementById('player-count').innerText = players.length;

            if(players.length > 0) {
                document.getElementById('tv-status').innerText = `Aguardando ${players[0].name} (Anfitrião) iniciar a partida...`;
            } else {
                document.getElementById('tv-status').innerText = "Aponte a câmara do telemóvel para o QR Code para entrar na sala";
            }

            for (let i = 0; i < 8; i++) {
                const seatDiv = document.createElement('div');
                seatDiv.className = 'seat';
                if (players[i]) {
                    seatDiv.classList.add('occupied');
                    seatDiv.innerHTML = `
                        <div class="avatar">${players[i].avatar}</div>
                        <div class="name">${players[i].name}</div>
                    `;
                } else {
                    seatDiv.innerHTML = `<span>Lugar ${i + 1}</span><small style="margin-top:4px;">Vazio</small>`;
                }
                seatsGrid.appendChild(seatDiv);
            }
        }

        renderSeats([]);

        socket.on('update-lobby', (players) => {
            renderSeats(players);
        });

        socket.on('start-round', (data) => {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('round-number').innerText = data.round;
            document.getElementById('theme-display').innerText = data.theme;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle - Jogo de Desenho</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/css/controle.css">
</head>
<body>

    <div class="card" id="login-screen">
        <h2>Entrar na Sala</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Escolha o seu apelido e um avatar:</p>
        
        <input type="text" id="nickname" placeholder="Seu apelido..." maxlength="12">
        
        <div class="avatars" id="avatar-grid">
            <div class="avatar-option selected" data-avatar="🦊">🦊</div>
            <div class="avatar-option" data-avatar="🐼">🐼</div>
            <div class="avatar-option" data-avatar="🐱">🐱</div>
            <div class="avatar-option" data-avatar="🐶">🐶</div>
            <div class="avatar-option" data-avatar="🦁">🦁</div>
            <div class="avatar-option" data-avatar="🦄">🦄</div>
            <div class="avatar-option" data-avatar="🤖">🤖</div>
            <div class="avatar-option" data-avatar="🚀">🚀</div>
        </div>

        <button id="join-btn">Entrar no Jogo</button>
        <div id="error-msg"></div>
    </div>

    <div class="card" id="waiting-screen" style="display: none;">
        <h2>Conectado!</h2>
        <div id="user-display" style="font-size: 3.5rem; margin: 15px 0;"></div>
        <p id="welcome-name" style="font-size: 1.25rem; font-weight: bold; color: #38bdf8; margin: 5px 0;"></p>
        
        <div id="host-controls" style="display: none; margin-top: 20px;">
            <p style="color: #facc15; font-weight: bold; margin-bottom: 10px;">Você é o Anfitrião! 👑</p>
            <button id="start-btn-mobile" style="background: #22c55e;">Iniciar Partida</button>
        </div>
        <p id="waiting-error-msg" class="waiting-error-msg" role="alert" hidden></p>
        <p id="waiting-msg" style="color: #94a3b8; font-size: 0.95rem; margin-top: 15px;">Aguardando o anfitrião iniciar o jogo...</p>
    </div>

    <div id="drawing-screen" style="display: none;">
        <!-- Injetado dinamicamente pelo JS -->
    </div>

    <div id="voting-screen" style="display: none;">
        <!-- Injetado dinamicamente pelo JS -->
    </div>

    <script type="module" src="/js/controle.js?v=3"></script>
</body>
</html>
